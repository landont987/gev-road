<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>GEV Road</title>
    <!-- No frames, plugins, forms or base changes: nothing but this page reaches the app bridge. -->
    <meta http-equiv="Content-Security-Policy" content="script-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <link rel="stylesheet" href="leaflet.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>

    <div id="status" class="card">
      <div class="speed"><span id="speed">--</span><small>MPH</small></div>
      <div class="meta"><span id="gps-state">NO GPS</span> &middot; <span id="data-used">DATA --</span></div>
      <div id="engine" class="meta" hidden></div>
      <div id="lowdata-badge" class="badge" hidden>LOW DATA ON</div>
    </div>

    <div id="rail">
      <button id="btn-route" class="rbtn">ROUTE</button>
      <button id="btn-cameras" class="rbtn explore-only">CAMERAS</button>
      <button id="btn-plates" class="rbtn explore-only">PLATE<br />READERS</button>
      <button id="btn-traffic" class="rbtn explore-only">TRAFFIC</button>
      <button id="btn-radio" class="rbtn">RADIO</button>
      <button id="btn-lowdata" class="rbtn">LOW<br />DATA</button>
      <button id="btn-drive" class="rbtn">DRIVE<br />MODE</button>
    </div>

    <div id="corner" class="explore-only">
      <button id="btn-zoom-in" class="zbtn" aria-label="Zoom in">+</button>
      <button id="btn-zoom-out" class="zbtn" aria-label="Zoom out">&minus;</button>
      <button id="btn-menu" class="zbtn" aria-label="Menu">&#9776;</button>
    </div>

    <button id="btn-recenter" class="pill" hidden>RECENTER</button>

    <div id="turnbar" hidden>
      <div class="turn-main">
        <div id="turn-dist"></div>
        <div id="turn-text"></div>
      </div>
      <div class="turn-side">
        <div id="trip-left"></div>
        <button id="btn-end-route" class="pill small">END</button>
      </div>
    </div>

    <!-- Road info card (road.js): slides in by itself near a closure, crash, sign, weather station or rest area. -->
    <div id="popup" class="pop" hidden></div>

    <aside id="sheet" hidden>
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="btn-sheet-close" class="pill small">CLOSE</button>
      </div>
      <div id="sheet-body"></div>
    </aside>

    <div id="toast" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
